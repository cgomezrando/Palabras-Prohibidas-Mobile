name: palabras_prohibidas_mobile
description: Palabras Prohibidas

# Paquete privado: nunca se publica en pub.dev.
publish_to: 'none'

# version: <CFBundleShortVersionString>+<CFBundleVersion>
# En Codemagic el build number se sobreescribe automáticamente
# (último build de TestFlight + 1), así que solo hay que subir la versión.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Paquetes usados por la app. Las implementaciones por plataforma
  # (_android, _ios, _web, _platform_interface...) se resuelven solas;
  # fijarlas a mano provoca conflictos de versiones al compilar.
  audio_session: 0.2.2
  auto_size_text: 3.0.0
  cached_network_image: 3.4.1
  collection: 1.19.1
  flutter_animate: 4.5.0
  flutter_cache_manager: 3.4.1
  font_awesome_flutter: 10.7.0
  from_css_color: 2.0.0
  go_router: 12.1.3
  google_fonts: 6.3.3
  intl: 0.20.2
  json_path: 0.7.2
  just_audio: 0.10.4
  page_transition: 2.1.0
  path_provider: 2.1.4
  provider: 6.1.5
  shared_preferences: 2.5.3
  sqflite: 2.3.3+1
  stop_watch_timer: 3.0.2
  timeago: 3.7.1
  url_launcher: 6.3.1
  cupertino_icons: ^1.0.8

dependency_overrides:
  http: 1.4.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.13.1
  flutter_lints: 4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/images/app_launcher_icon.png'

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

  fonts:
    - family: 'Digital'
      fonts:
        - asset: assets/fonts/Mulish-Regular.ttf
