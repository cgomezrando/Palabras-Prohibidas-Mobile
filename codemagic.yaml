workflows:
  ios-release:
    name: Palabras Prohibidas - iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: CodemagicASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cgr.PalabrasProhibidasMobile
      vars:
        BUNDLE_ID: "com.cgr.PalabrasProhibidasmMobile"
        APP_STORE_APPLE_ID: 0000000000
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Instalar dependencias Flutter
        script: |
          flutter pub get

      - name: Configurar iPhone y orientación vertical
        script: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :LSRequiresIPhoneOS true" $PLIST
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Generar iconos de la app
        script: |
          dart run flutter_launcher_icons

      - name: Instalar pods
        script: |
          find . -name "Podfile" -execdir pod install --repo-update \;

      - name: Configurar firma de código
        script: |
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST_BUILD + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - cgomezrando@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false