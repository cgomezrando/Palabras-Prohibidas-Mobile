workflows:
  ios-release:
    name: Palabras Prohibidas - iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Nombre de la API key de App Store Connect creada en
      # Codemagic > Team settings > Integrations > Developer Portal
      app_store_connect: CodemagicASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cgr.PalabrasProhibidasmMobile
      vars:
        BUNDLE_ID: "com.cgr.PalabrasProhibidasmMobile"
        # ID numérico de la app en App Store Connect (App Information > Apple ID)
        APP_STORE_APPLE_ID: 0000000000
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Instalar dependencias Flutter
        script: |
          flutter pub get

      - name: Generar iconos de la app
        script: |
          dart run flutter_launcher_icons

      - name: Instalar pods
        script: |
          find . -name "Podfile" -execdir pod install --repo-update \;

      - name: Configurar firma de código
        script: |
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST_BUILD + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - cgomezrando@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
